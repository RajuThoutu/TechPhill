<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | The Tech Philosophers</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Poppins:wght@500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <header></header>

    <main>
        <section>
            <div class="container">
                <div class="grid-2">
                    <div>
                        <h1 class="section-title" style="text-align: left;">Get in Touch</h1>
                        <p style="color: var(--text-secondary); margin-bottom: 2rem;">
                            Whether you have a question about AI, want to discuss a project, or just want to say hello,
                            I'd love to hear from you.
                        </p>

                        <form style="display: flex; flex-direction: column; gap: 1rem;">
                            <input type="text" placeholder="Name"
                                style="padding: 1rem; border-radius: var(--radius-sm); border: 1px solid var(--border-color); font-family: var(--font-main);">
                            <input type="email" placeholder="Email"
                                style="padding: 1rem; border-radius: var(--radius-sm); border: 1px solid var(--border-color); font-family: var(--font-main);">
                            <textarea placeholder="Message" rows="5"
                                style="padding: 1rem; border-radius: var(--radius-sm); border: 1px solid var(--border-color); font-family: var(--font-main);"></textarea>
                            <button type="submit" class="btn-primary" style="align-self: flex-start;">Send
                                Message</button>
                        </form>
                    </div>
                    <div style="padding-left: 2rem;">
                        <div class="card">
                            <h3>Other ways to reach me</h3>
                            <div style="margin-top: 2rem; display: flex; flex-direction: column; gap: 1rem;">
                                <a href="#" style="display: flex; align-items: center; gap: 1rem;">
                                    <span>📧</span> email@example.com
                                </a>
                                <a href="#" style="display: flex; align-items: center; gap: 1rem;">
                                    <span>🔗</span> LinkedIn Profile
                                </a>
                                <a href="#" style="display: flex; align-items: center; gap: 1rem;">
                                    <span>📺</span> YouTube Channel
                                </a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <footer></footer>
    <script src="js/components.js"></script>
</body>

</html>
